# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "vostok-resource-porter"
version = "0.1.0"
edition = "2024"
description = "Map and asset converter for Survarium v0.100b and v0.26g clients"
license = "GPL-3.0-or-later"
readme = "README.md"
repository = "https://github.com/srp-survarium/resource-porter"
publish = false

[workspace]
resolver = "3"

[[bin]]
name = "vostok-port"
path = "src/main.rs"

[[bin]]
name = "vostok-sdk-backend"
path = "src/bin/vostok-sdk-backend.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crc32fast = "1.4"
encoding_rs = "0.8"
flate2 = "1.0"
png = "0.17"
# The archive code: skhid-srp's `srp-026g/crates/resources-db` (branch
# release/resources-db-porter-needs, on top of release/scripts).
resources-db = { git = "https://github.com/srp-survarium/skhid-srp", rev = "c81c234906dcfd94207f6a701c9421af969049a1" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3.20"

[profile.release]
lto = "thin"
opt-level = 3
strip = true
