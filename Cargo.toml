[package]
name = "vostok-resource-porter"
version = "0.1.0"
edition = "2024"
description = "Cross-version Survarium and STK2 asset importer for the v0.100b client"
license = "MIT"

[[bin]]
name = "vostok-port"
path = "src/main.rs"

[[bin]]
name = "vostok-sdk-backend"
path = "src/bin/vostok-sdk-backend.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crc32fast = "1.4"
encoding_rs = "0.8"
lzo = "0.1.4"
resources-db = { path = "deps/vostok-resources-db" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3.20"

[profile.release]
lto = "thin"
opt-level = 3
strip = true
